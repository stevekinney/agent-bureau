name: Nightly

# AB-282/tst-09e — the slower-cadence lanes AB-100 says must not run on
# every pull request: the full process-crash marker matrix (every marker,
# both persistent backends once AB-271 lands — SQLite only until then), the
# full Gateway conformance lane, and the Cloudflare real-runtime lane. Each
# already runs on the pull-request lane in reduced or absent form (the crash
# lane as a single smoke scenario in `ci.yml`'s `crash-conformance-smoke`
# job; gateway conformance already runs in full on every pull request via
# `validate`'s own step — this job re-runs it nightly so a flake surfaces on
# a schedule too, independent of pull-request volume; cloudflare
# conformance is not wired into `ci.yml` at all, so this is its only lane).
#
# AB-284/tst-09g added a fifth lane, `mutation-check`: the targeted lifecycle
# mutation check (`bun run check-mutation`) re-runs its covering tests once
# per candidate mutant across four target sets, which is exactly the kind
# of repeated-test-run cost AB-100 rules out of the pull-request lane. It
# has no pull-request-lane counterpart at all (unlike crash, which gets a
# smoke scenario there) because a mutation check has no meaningful "smoke"
# subset — a single mutant proves nothing about the other three target
# sets.
#
# Schedule: 09:00 UTC. The most recent 100 `ci.yml` runs, checked when this
# workflow was added, cluster between 19:00 and 02:00 UTC with zero runs
# anywhere in the 03:00-18:00 UTC band — 09:00 UTC sits well inside that
# quiet gap, so the nightly lanes never contend with pull-request-lane
# runners for the shared Actions concurrency budget and a red run shows up
# on its own, not buried in same-hour pull-request noise. `workflow_dispatch`
# lets a release reviewer trigger the same three lanes on demand instead of
# waiting for the schedule — see `documentation/testing-cadence.md` for why
# a green nightly is required release evidence.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # No job below retries a failed step and none raises a timeout relative to
  # the pull-request lane's own jobs (none of which sets `timeout-minutes`
  # either) — a flake here is a defect to root-cause, not a limit to widen
  # (AB-100). This workflow opens no issue on failure; a red run is visible
  # on the repository's Actions page and named in
  # `documentation/testing-cadence.md` as required release evidence, so a
  # release must not proceed while the most recent scheduled run is red.

  crash-conformance-full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build crash-conformance dependencies
        run: bun run turbo run build --filter=integration

      # Every marker in the matrix, over every backend the harness supports
      # today (SQLite; LMDB joins when AB-271 lands — see
      # `documentation/testing-cadence.md`). No `--test-name-pattern`, unlike
      # the pull-request lane's single smoke scenario.
      - name: Crash-conformance full matrix
        run: time bun run test:crash-conformance

  gateway-conformance-full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `test:gateway-conformance` is a plain `bun test`, not a turbo task,
      # so — unlike the pull-request lane, where this same command runs
      # inside `validate` AFTER `bun run validate` has already built every
      # workspace dependency — this standalone job must build gateway's own
      # dependency graph first. Found and fixed via this workflow's own
      # first manual `workflow_dispatch` run: gateway's conformance suite
      # failed with "Cannot find module '@lostgradient/operative'" without
      # this step.
      - name: Build gateway dependencies
        run: bun run turbo run build --filter=gateway

      - name: Gateway real-transport conformance (full)
        run: time bun run test:gateway-conformance

  cloudflare-conformance:
    # AB-99/AB-276's own verification step: this lane is Linux-only.
    # `ubuntu-latest` already satisfies that; the constraint is stated
    # explicitly here rather than left implicit, per this issue's own
    # acceptance criterion.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cloudflare real-runtime conformance (workerd/Miniflare)
        run: time bun run test:cloudflare-conformance

  mutation-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `check-mutation.ts`'s pre-mutation sanity pass runs every target set's covering tests
      # UNMUTATED first, before any package has been rebuilt by the script itself — including
      # in-package tests like `packages/armorer/test/execution-lifecycle.test.ts`, which imports
      # `from 'lifecycle'` and resolves it through that package's own `exports` map to `dist/`,
      # not `src/`. A fresh checkout has no `dist/` anywhere, so without this step the sanity pass
      # fails immediately with an import error, misreported as "covering tests do not pass" (the
      # `gateway-conformance-full` job above hit exactly this class of failure on its own first
      # dispatch — see its own comment). Once this step has built every workspace package,
      # `check-mutation.ts` only needs to rebuild the SPECIFIC package(s) each cross-package
      # covering test names in `mutation-targets.json`'s `rebuild` field before that mutant's own
      # test run, and once more after each target set finishes to leave `dist/` matching the
      # restored `src/` — see the script's own doc comment.
      - name: Build every workspace package
        run: bun run turbo run build

      - name: Targeted lifecycle mutation check
        run: time bun run check-mutation
