name: CI

# Pull-request checks. release.yml only runs on push to main, so this is where per-PR validation
# happens: full build/lint/types/tests, the 100% coverage gate on the packages listed in the root
# coverage:check filter, plus the publishable-package shape gate (the regression guard that fails if
# a publishable package ever ships a foundation-package leak or undeclared external).

on:
  pull_request:
    branches:
      - main
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # The integration suite includes a cross-runtime test (runtime.test.mjs)
      # that runs under Node's own test runner (node:test). setup-bun installs
      # only Bun, so without a real Node on PATH the runner's node resolution can
      # fall through to Bun, which cannot execute node:test files. Install Node
      # explicitly. Ordered AFTER setup-bun so its PATH entry leads for `node`.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate (format, lint, types, test)
        run: bun run validate

      # AB-98/AB-272 — real Bun HTTP/SSE/WebSocket loopback conformance.
      # Not run through turbo's `test` task (that already ran above, as
      # part of `bun run validate`) so gateway's own dependencies are
      # already built by the time this plain `bun test` runs. AB-282 owns
      # this lane's intended long-term cadence; this wires it in as its
      # own step for now.
      - name: Gateway real-transport conformance (AB-98)
        run: bun run test:gateway-conformance

      # AB-267 — replays the committed reproduction-artifact fixture through
      # the one-command replay path on every pull request, so the replay
      # path is exercised continuously rather than only when someone
      # remembers to run it by hand.
      - name: Reproduction-artifact replay (AB-267)
        run: bun run test:replay-artifact -- packages/integration/test/fixtures/reproduction/baseline.json

  coverage-and-package-shape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Coverage gate (100% on gated packages)
        run: bun run coverage:check

      - name: Build publishable packages
        run: bun run turbo run build --filter=armorer --filter=conversationalist --filter=@lostgradient/operative

      - name: Package-shape gate (no foundation leaks, no undeclared externals)
        run: bun run check-package-shape

      - name: Operative packed-consumer verification (AB-23)
        run: bun run test:consumer:operative

      - name: Bureau tarball-boundary verification (AB-23)
        run: bun run verify:bureau:tarball-boundary

  # AB-282/tst-05a — the fast black-box lifecycle contract matrix (AB-268).
  # `bun run integration` runs `turbo run integration --filter=integration`,
  # which runs the `integration` package's own `bun run validate` — its
  # format/lint/types/test pipeline, including
  # `test/lifecycle-contract/contract.test.ts` (the registered matrix) and
  # every adapter suite under `test/lifecycle-contract/adapters/`. This is a
  # separate job from `validate` above (which already runs each package's
  # own `test` task through Turborepo) so a contract-matrix failure is its
  # own reported check, not buried inside the aggregate `validate` job.
  lifecycle-contract:
    runs-on: ubuntu-latest
    env:
      # The reproduction-artifact contract documented in
      # `documentation/testing-cadence.md`: a scenario that wants a failure
      # reproducible from the run page writes its assembled artifact (via
      # `writeReproductionArtifact`, AB-267's `@lostgradient/operative/test`)
      # to this directory. The upload step below picks up whatever lands
      # there.
      REPRODUCTION_ARTIFACT_DIR: ${{ github.workspace }}/reproduction-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lifecycle contract matrix (AB-268, tst-05a)
        run: time bun run integration

      # A failing lifecycle fixture prints the full `QuiescenceReport`
      # (`BureauQuiescenceError`'s message, from `packages/bureau/src/test/quiescence.ts`)
      # straight into this step's own output — no extra wiring needed for the
      # ownership-tree text. This step separately picks up any reproduction
      # artifact a failing scenario wrote to the shared
      # `${{ github.workspace }}/reproduction-artifacts/` directory (the contract
      # documented in `documentation/testing-cadence.md`) so it survives past
      # the ephemeral runner. No suite writes there today — `if-no-files-found:
      # ignore` keeps this a no-op until one does — but the writer
      # (`writeReproductionArtifact`, AB-267's `@lostgradient/operative/test`)
      # already exists, so a failing scenario can start writing to it without
      # a workflow change.
      - name: Upload reproduction artifact (if generated)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-artifacts-lifecycle-contract
          path: ${{ github.workspace }}/reproduction-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  crash-conformance-smoke:
    runs-on: ubuntu-latest
    env:
      REPRODUCTION_ARTIFACT_DIR: ${{ github.workspace }}/reproduction-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build crash-conformance dependencies
        run: bun run turbo run build --filter=integration

      # AB-270/AB-282 — real process-kill recovery conformance over SQLite.
      # Only the single `[smoke]`-tagged scenario (a kill-vs-control honesty
      # pair: killing at the 'checkpoint-committed' marker recovers a
      # committed effect; a 'run-started' control killed before that marker
      # never reaches it) runs on the pull-request lane. The selection
      # mechanism is the `--test-name-pattern smoke` argument below, passed
      # through the stable `test:crash-conformance` root command rather than
      # invoking `bun test` directly, so the pull-request lane and the full
      # nightly matrix (`bun run test:crash-conformance` with no pattern —
      # every marker, both backends once AB-271 lands) share one root
      # command. AB-100 rules out running every crash permutation on every
      # pull request; the full matrix runs at `nightly.yml`'s cadence.
      - name: Crash-conformance smoke scenario (checkpoint-committed vs. run-started)
        run: time bun run test:crash-conformance -- --test-name-pattern smoke

      - name: Upload reproduction artifact (if generated)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-artifacts-crash-smoke
          path: ${{ github.workspace }}/reproduction-artifacts/
          if-no-files-found: ignore
          retention-days: 14
